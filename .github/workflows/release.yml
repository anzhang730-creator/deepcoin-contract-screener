name: Windows release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        shell: pwsh
        run: |
          $env:DEEPCOIN_VERSION = "${{ github.ref_name }}"
          ./build_release.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            DeepcoinScreen-Windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
